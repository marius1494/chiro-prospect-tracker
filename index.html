<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chiro Prospect Tracker</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --panel-2:#eef1f4; --border:#d9dee5;
    --text:#1c2530; --muted:#6b7683; --accent:#2f6feb; --accent-weak:#e5edfd;
    --good:#1a7f47; --good-bg:#e3f4ea; --warn:#8a5d00; --warn-bg:#fbefd4;
    --bad:#b23b3b; --bad-bg:#f7e2e2;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0f1115; --panel:#171a21; --panel-2:#1e222b; --border:#2c313c;
      --text:#e6e9ee; --muted:#95a0ad; --accent:#5b8dff; --accent-weak:#1c2740;
      --good:#57c98a; --good-bg:#12301f; --warn:#e0b25a; --warn-bg:#33280f;
      --bad:#e8807f; --bad-bg:#331a1a;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f1115; --panel:#171a21; --panel-2:#1e222b; --border:#2c313c;
    --text:#e6e9ee; --muted:#95a0ad; --accent:#5b8dff; --accent-weak:#1c2740;
    --good:#57c98a; --good-bg:#12301f; --warn:#e0b25a; --warn-bg:#33280f;
    --bad:#e8807f; --bad-bg:#331a1a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  a{color:var(--accent)}
  header{padding:12px 16px;border-bottom:1px solid var(--border);background:var(--panel);
    display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;position:sticky;top:0;z-index:5}
  h1{font-size:15px;margin:0;font-weight:650;white-space:nowrap}
  .stats{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--muted)}
  .chip{background:var(--panel-2);border:1px solid var(--border);border-radius:20px;padding:2px 9px}
  .chip b{color:var(--text)}
  .spacer{flex:1}
  .wrap{padding:12px 16px;max-width:1600px;margin:0 auto}
  input,select,button,textarea{font:inherit;color:inherit}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;align-items:center}
  .toolbar input[type=search],.toolbar select{background:var(--panel);border:1px solid var(--border);border-radius:7px;padding:6px 9px}
  .toolbar input[type=search]{min-width:220px}
  button{background:var(--panel);border:1px solid var(--border);border-radius:7px;padding:6px 11px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .notice{background:var(--warn-bg);color:var(--warn);border:1px solid var(--border);border-radius:8px;padding:9px 12px;margin-bottom:10px;font-size:13px}
  .notice.err{background:var(--bad-bg);color:var(--bad)}
  .tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;background:var(--panel)}
  table{border-collapse:collapse;width:100%;min-width:960px}
  th,td{text-align:left;padding:4px 6px;border-bottom:1px solid var(--border);vertical-align:middle}
  th{background:var(--panel-2);cursor:pointer;white-space:nowrap;font-weight:600;user-select:none;position:sticky;top:0}
  th[data-k]:hover{color:var(--accent)}
  th .arr{font-size:10px;color:var(--muted)}
  td.expcol,th.expcol{width:26px;text-align:center;padding:4px 2px}
  .expbtn{border:none;background:transparent;padding:2px 4px;cursor:pointer;color:var(--muted);font-size:12px}
  tr.prow.rs-Angeschrieben td,tr.prow.rs-Followup1 td,tr.prow.rs-Followup2 td{background:color-mix(in srgb,var(--warn) 11%,var(--panel))}
  tr.prow.rs-Antworterhalten td,tr.prow.rs-Callvereinbart td{background:color-mix(in srgb,var(--accent) 13%,var(--panel))}
  tr.prow.rs-Kunde td{background:color-mix(in srgb,var(--good) 15%,var(--panel))}
  tr.prow.rs-KeinFit td,tr.prow.rs-Abgesagt td{background:color-mix(in srgb,var(--bad) 11%,var(--panel))}
  tr.prow:hover td{background:var(--panel-2)}
  /* inline-editierbare Zellen */
  .cin,.csel{width:100%;min-width:70px;background:transparent;border:1px solid transparent;border-radius:5px;
    padding:5px 6px;color:inherit;font:inherit}
  .cin:hover,.csel:hover{border-color:var(--border)}
  .cin:focus,.csel:focus{border-color:var(--accent);background:var(--panel);outline:none}
  .csel{cursor:pointer}
  td.c-status .csel{font-weight:600}
  td.c-name{min-width:240px} td.c-name .cin{font-weight:600}
  td.c-owner{min-width:100px} td.c-status{min-width:150px}
  td.c-website{min-width:180px} td.c-email{min-width:190px} td.c-date{min-width:150px}
  td.c-fu{min-width:74px;text-align:center}
  .lnk{margin-left:2px;font-size:12px;text-decoration:none;opacity:.8}
  .lnk:hover{opacity:1}
  input[type=date].cin{min-width:120px}
  .fu-wrap{display:flex;flex-direction:column;align-items:center;gap:1px}
  input[type=checkbox].fu{width:19px;height:19px;accent-color:var(--good);cursor:pointer;margin:0}
  .fu-date{font-size:10px;color:var(--muted)}
  .score-1{color:var(--muted)} .score-2{color:var(--warn)} .score-3{color:var(--good);font-weight:700}
  .badge-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
  .st-Neu{background:var(--muted)} .st-Angeschrieben,.st-Followup1,.st-Followup2{background:var(--warn)}
  .st-Antworterhalten,.st-Callvereinbart{background:var(--accent)} .st-Kunde{background:var(--good)}
  .st-KeinFit,.st-Abgesagt{background:var(--bad)}
  tr.drow td{background:var(--panel-2);padding:12px 14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
  .fld{display:flex;flex-direction:column;gap:3px}
  .fld label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
  .fld input,.fld textarea{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:6px 8px;width:100%;color:inherit;font:inherit}
  .fld textarea{min-height:50px;resize:vertical}
  .drow-actions{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .muted{color:var(--muted)}
  .brand{display:flex;align-items:center;justify-content:center;gap:9px;margin:34px 0 22px;
    color:var(--muted);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
  .brand svg{width:22px;height:22px;opacity:.85}
  .brand b{font-weight:600;letter-spacing:.16em;color:var(--text)}
  code{background:var(--panel-2);padding:1px 4px;border-radius:4px}
  dialog{border:1px solid var(--border);border-radius:12px;background:var(--panel);color:var(--text);max-width:680px;width:92vw;padding:0}
  dialog::backdrop{background:rgba(0,0,0,.45)}
  .dlg{padding:16px}
  .dlg textarea{width:100%;min-height:220px;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:10px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
</style>
</head>
<body>
<header>
  <h1>Chiro Prospect Tracker</h1>
  <div class="stats" id="stats"></div>
  <div class="spacer"></div>
  <button id="themeBtn" title="Hell / Dunkel">◐</button>
</header>

<div class="wrap">
  <div id="loadNotice"></div>

  <div class="toolbar">
    <input type="search" id="q" placeholder="Suche: Name, Stadt, E-Mail, Notiz…">
    <select id="fOwner"><option value="">Alle Bearbeiter</option></select>
    <select id="fStatus"><option value="">Alle Status</option></select>
    <button id="addBtn" class="primary">+ Prospect hinzufügen</button>
    <div class="spacer"></div>
    <button id="exportBtn">Exportieren</button>
    <button id="resetBtn" title="Nicht gespeicherte Änderungen verwerfen">Zurücksetzen</button>
  </div>

  <div id="dirtyNotice"></div>

  <div class="tablewrap">
  <table id="tbl">
    <thead><tr>
      <th class="expcol"></th>
      <th data-k="name">Name <span class="arr"></span></th>
      <th data-k="owner">Bearb. <span class="arr"></span></th>
      <th data-k="status">Status <span class="arr"></span></th>
      <th data-k="website">Website <span class="arr"></span></th>
      <th data-k="email">E-Mail <span class="arr"></span></th>
      <th data-k="contactedDate">Angeschrieben <span class="arr"></span></th>
      <th data-k="followUp1">FU 1 <span class="arr"></span></th>
      <th data-k="followUp2">FU 2 <span class="arr"></span></th>
    </tr></thead>
    <tbody id="tbody"></tbody>
  </table>
  </div>

  <footer class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 3.5c-1.7 2.1-1.7 5.3 0 7.4 1.7-2.1 1.7-5.3 0-7.4Z"/>
      <path d="M6.2 8c-.7 2.6.8 5.4 3.8 6.4-.2-2.8-1.7-5.4-3.8-6.4Z"/>
      <path d="M17.8 8c.7 2.6-.8 5.4-3.8 6.4.2-2.8 1.7-5.4 3.8-6.4Z"/>
      <path d="M3.5 13.6c2.2 2.7 5.3 3.9 8.5 3.9s6.3-1.2 8.5-3.9"/>
    </svg>
    <span>Made by <b>Business&nbsp;Buddha</b></span>
  </footer>
</div>

<dialog id="exportDlg">
  <div class="dlg">
    <h3 style="margin:0 0 8px">Exportieren</h3>
    <p class="muted" style="margin:0 0 8px">Ersetze <code>data.json</code> im Repo mit diesem Inhalt und committe.</p>
    <div class="drow-actions" style="margin-top:0">
      <button id="dlJson" class="primary">data.json herunterladen</button>
      <button id="cpJson">JSON kopieren</button>
      <button id="cpCsv">CSV kopieren</button>
      <button id="closeDlg">Schließen</button>
    </div>
    <textarea id="exportText" readonly spellcheck="false"></textarea>
  </div>
</dialog>

<script>
const STATUSES = ["Neu","Angeschrieben","Follow-up 1","Follow-up 2","Antwort erhalten","Call vereinbart","Kunde","Kein Fit","Abgesagt"];
const OWNERS = ["","Marius","Moritz"];
const DETAIL_FIELDS = [
  ["city","Stadt / State","text"],["score","Score (1-3)","text"],
  ["youtube","YouTube","text"],["instagram","Instagram","text"],["hookVideoTitle","Video-Titel für Hook","text"],
  ["subs","Abos","text"],["lastUpload","Letzter Upload","text"],["bestVideoViews","Bestes Video (Views)","text"],
  ["moneySignal","Money-Signal","textarea"],["notes","Notizen","textarea"],["source","Quelle","text"]
];
const LS_KEY = "chiroTracker.working";
const todayStr = new Date().toISOString().slice(0,10);

let model = null, dirty = false;
let sortK = "name", sortDir = 1;
const expanded = new Set();

/* theme */
const themeBtn = document.getElementById("themeBtn");
const applyTheme = t => t ? document.documentElement.setAttribute("data-theme",t) : document.documentElement.removeAttribute("data-theme");
applyTheme(localStorage.getItem("chiroTracker.theme"));
themeBtn.onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur==="dark" ? "light" : cur==="light" ? "" : "dark";
  localStorage.setItem("chiroTracker.theme", next); applyTheme(next);
};

/* load */
async function load(){
  const saved = localStorage.getItem(LS_KEY);
  if(saved){
    try{ model = JSON.parse(saved); dirty = true; normalize();
      setNotice("Ungespeicherte Änderungen aus diesem Browser geladen. Der Zurücksetzen-Button lädt wieder data.json.", "dirty");
      init(); return;
    }catch(e){}
  }
  try{
    const r = await fetch("./data.json", {cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    model = await r.json(); normalize(); init();
  }catch(e){
    document.getElementById("loadNotice").innerHTML =
      '<div class="notice err"><b>data.json konnte nicht geladen werden</b> ('+e.message+'). '+
      'Beim Öffnen per Doppelklick blockiert der Browser den Zugriff. Lösung: im Ordner '+
      '<code>python3 -m http.server</code> starten und <a href="http://localhost:8000/">localhost:8000</a> öffnen — '+
      'oder die GitHub-Pages-URL nutzen.</div>';
  }
}
function normalize(){
  model.prospects.forEach(p=>{
    p.followUp1 = !!p.followUp1; p.followUp2 = !!p.followUp2;
    ["followUp1Date","followUp2Date","contactedDate","website","email","city","owner","status","name",
     "youtube","instagram","hookVideoTitle","subs","lastUpload","bestVideoViews","moneySignal","notes","source"]
      .forEach(k=> p[k] = p[k]==null ? "" : p[k]);
    if(p.id==null) p.id = "p-"+Math.random().toString(36).slice(2,9);
  });
}
function setNotice(msg, kind){
  document.getElementById(kind==="dirty" ? "dirtyNotice" : "loadNotice").innerHTML =
    msg ? '<div class="notice">'+msg+'</div>' : "";
}
function markDirty(){
  dirty = true;
  try{ localStorage.setItem(LS_KEY, JSON.stringify(model)); }catch(e){}
  setNotice('Ungespeicherte Änderungen (nur in diesem Browser). Zum Sichern: <b>Exportieren</b> → data.json ersetzen &amp; committen.', "dirty");
  renderStats();
}

/* init */
function init(){
  const fO = document.getElementById("fOwner");
  [...new Set(model.prospects.map(p=>p.owner).filter(Boolean))].sort().forEach(o=>fO.add(new Option(o,o)));
  const fS = document.getElementById("fStatus");
  STATUSES.forEach(s=>fS.add(new Option(s,s)));
  ["q","fOwner","fStatus"].forEach(id=>document.getElementById(id).addEventListener("input", renderTable));
  document.querySelectorAll("th[data-k]").forEach(th=>th.onclick=()=>{
    const k = th.dataset.k;
    if(sortK===k) sortDir*=-1; else { sortK=k; sortDir = 1; }
    updateArrows(); renderTable();
  });
  document.getElementById("addBtn").onclick = addProspect;
  document.getElementById("resetBtn").onclick = ()=>{
    if(!confirm("Nicht gespeicherte Änderungen verwerfen und data.json neu laden?")) return;
    localStorage.removeItem(LS_KEY); location.reload();
  };
  document.getElementById("exportBtn").onclick = openExport;
  updateArrows(); renderTable();
}
function updateArrows(){
  document.querySelectorAll("th[data-k]").forEach(th=>{
    th.querySelector(".arr").textContent = th.dataset.k===sortK ? (sortDir>0?"▲":"▼") : "";
  });
}

/* filter + sort */
function rows(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  const o = document.getElementById("fOwner").value;
  const s = document.getElementById("fStatus").value;
  let r = model.prospects.filter(p=>{
    if(o && p.owner!==o) return false;
    if(s && p.status!==s) return false;
    if(q){
      const hay = [p.name,p.city,p.email,p.website,p.notes,p.moneySignal,p.hookVideoTitle].join(" ").toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  return r.sort((a,b)=>{
    let x=a[sortK], y=b[sortK];
    if(sortK==="followUp1"||sortK==="followUp2"){ return ((x?1:0)-(y?1:0))*sortDir; }
    x=(x||"").toString().toLowerCase(); y=(y||"").toString().toLowerCase();
    return x<y ? -sortDir : x>y ? sortDir : 0;
  });
}

/* helpers to build editable cells */
function textCell(p, key, cls){
  const td = document.createElement("td"); td.className = "c-"+(cls||key);
  const inp = document.createElement("input"); inp.type="text"; inp.className="cin"; inp.value = p[key]||"";
  inp.addEventListener("change", ()=>{ p[key] = inp.value; markDirty(); });
  td.appendChild(inp);
  if(key==="website" || key==="email"){
    const a = document.createElement("a"); a.className="lnk"; a.textContent = key==="email" ? "✉" : "↗";
    a.target="_blank"; a.rel="noopener";
    const setHref = ()=>{ a.href = key==="email" ? ("mailto:"+inp.value) : inp.value; a.style.display = inp.value ? "" : "none"; };
    setHref(); inp.addEventListener("input", setHref);
    td.appendChild(a);
  }
  return td;
}
function selectCell(p, key, opts, cls, cb){
  const td = document.createElement("td"); td.className = "c-"+(cls||key);
  const sel = document.createElement("select"); sel.className="csel";
  opts.forEach(o=> sel.add(new Option(o==="" ? "—" : o, o)));
  sel.value = p[key]==null ? "" : String(p[key]);
  if(key==="status"){
    const dot = document.createElement("span");
    dot.className = "badge-dot st-"+(p.status||"Neu").replace(/[^A-Za-z0-9]/g,"");
    td.appendChild(dot);
    sel.addEventListener("change", ()=>{
      p.status = sel.value;
      dot.className = "badge-dot st-"+(p.status||"Neu").replace(/[^A-Za-z0-9]/g,"");
      markDirty(); if(cb) cb();
    });
  } else {
    sel.addEventListener("change", ()=>{ p[key] = sel.value; markDirty(); if(cb) cb(); });
  }
  td.appendChild(sel);
  return td;
}
function dateCell(p, key){
  const td = document.createElement("td"); td.className="c-date";
  const inp = document.createElement("input"); inp.type="date"; inp.className="cin"; inp.value = p[key]||"";
  inp.addEventListener("change", ()=>{ p[key] = inp.value; markDirty(); });
  td.appendChild(inp);
  return td;
}
function fuCell(p, num){
  const boolKey = "followUp"+num, dateKey = "followUp"+num+"Date";
  const td = document.createElement("td"); td.className="c-fu";
  const wrap = document.createElement("div"); wrap.className="fu-wrap";
  const cb = document.createElement("input"); cb.type="checkbox"; cb.className="fu"; cb.checked = !!p[boolKey];
  const dt = document.createElement("span"); dt.className="fu-date"; dt.textContent = p[dateKey]||"";
  cb.addEventListener("change", ()=>{
    p[boolKey] = cb.checked;
    if(cb.checked && !p[dateKey]){ p[dateKey] = todayStr; dt.textContent = todayStr; }
    markDirty();
  });
  wrap.append(cb, dt);
  td.appendChild(wrap);
  return td;
}

/* render */
function applyRowStatus(tr, status){
  tr.className = "prow rs-"+(status||"Neu").replace(/[^A-Za-z0-9]/g,"");
}
function renderTable(){
  const tb = document.getElementById("tbody");
  tb.innerHTML = "";
  rows().forEach(p=>{
    const tr = document.createElement("tr"); tr.className="prow";
    const exp = document.createElement("td"); exp.className="expcol";
    const eb = document.createElement("button"); eb.className="expbtn"; eb.textContent = expanded.has(p.id) ? "▾" : "▸";
    eb.title = "Zusatzfelder";
    eb.onclick = ()=>{ expanded.has(p.id) ? expanded.delete(p.id) : expanded.add(p.id); renderTable(); };
    exp.appendChild(eb); tr.appendChild(exp);

    tr.appendChild(textCell(p,"name"));
    tr.appendChild(selectCell(p,"owner",OWNERS));
    tr.appendChild(selectCell(p,"status",STATUSES,"status",()=>applyRowStatus(tr,p.status)));
    tr.appendChild(textCell(p,"website"));
    tr.appendChild(textCell(p,"email"));
    tr.appendChild(dateCell(p,"contactedDate"));
    tr.appendChild(fuCell(p,1));
    tr.appendChild(fuCell(p,2));
    applyRowStatus(tr, p.status);
    tb.appendChild(tr);

    if(expanded.has(p.id)) tb.appendChild(detailRow(p));
  });
  renderStats();
}
function renderStats(){
  const ps = model.prospects;
  const st = ps.reduce((m,p)=>(m[p.status||"Neu"]=(m[p.status||"Neu"]||0)+1,m),{});
  const parts = ['<span class="chip"><b>'+ps.length+'</b> gesamt</span>'];
  ["Neu","Angeschrieben","Follow-up 1","Follow-up 2","Antwort erhalten","Call vereinbart","Kunde"].forEach(s=>{
    if(st[s]) parts.push('<span class="chip">'+s+': <b>'+st[s]+'</b></span>');
  });
  parts.push('<span class="chip">FU1 ✓ <b>'+ps.filter(p=>p.followUp1).length+'</b></span>');
  parts.push('<span class="chip">FU2 ✓ <b>'+ps.filter(p=>p.followUp2).length+'</b></span>');
  document.getElementById("stats").innerHTML = parts.join("");
}
function detailRow(p){
  const tr = document.createElement("tr"); tr.className="drow";
  const td = document.createElement("td"); td.colSpan = 9;
  const g = document.createElement("div"); g.className="grid";
  DETAIL_FIELDS.forEach(([k,label,type])=>{
    const f = document.createElement("div"); f.className="fld";
    const lab = document.createElement("label"); lab.textContent = label;
    const ctrl = document.createElement(type==="textarea" ? "textarea" : "input");
    if(type!=="textarea") ctrl.type = "text";
    ctrl.value = p[k]||"";
    ctrl.addEventListener("change", ()=>{ p[k] = ctrl.value; markDirty(); });
    f.append(lab, ctrl); g.appendChild(f);
  });
  td.appendChild(g);

  const act = document.createElement("div"); act.className="drow-actions";
  const links = document.createElement("span"); links.className="muted";
  const mk = (h,t)=> h ? '<a href="'+h.replace(/"/g,"&quot;")+'" target="_blank" rel="noopener">'+t+' ↗</a>' : "";
  links.innerHTML = [mk(p.youtube,"YouTube"), mk(p.website,"Website"), mk(p.instagram,"Instagram")].filter(Boolean).join(" &nbsp;·&nbsp; ");
  const del = document.createElement("button");
  del.textContent = "Prospect löschen";
  del.onclick = ()=>{ if(confirm("Löschen: "+p.name+" ?")){ model.prospects = model.prospects.filter(x=>x!==p); expanded.delete(p.id); markDirty(); renderTable(); } };
  const close = document.createElement("button"); close.textContent = "Einklappen";
  close.onclick = ()=>{ expanded.delete(p.id); renderTable(); };
  act.append(close, del, links);
  td.appendChild(act);
  tr.appendChild(td);
  return tr;
}

function addProspect(){
  const id = "neu-"+Date.now().toString(36);
  model.prospects.unshift({
    id, name:"Neuer Prospect", city:"", owner:"", status:"Neu", score:"", email:"", website:"", youtube:"", instagram:"",
    hookVideoTitle:"", subs:"", lastUpload:"", bestVideoViews:"", moneySignal:"", notes:"",
    contactedDate:"", followUp1:false, followUp1Date:"", followUp2:false, followUp2Date:"",
    source:"manuell "+todayStr
  });
  expanded.add(id);
  ["q","fOwner","fStatus"].forEach(fid=>{ const el=document.getElementById(fid); if(el) el.value=""; });
  sortK = "name"; sortDir = 1; updateArrows();
  renderTable();
  markDirty();
  window.scrollTo({top:0,behavior:"smooth"});
  const firstRow = document.querySelector("#tbody tr.prow");
  if(firstRow){
    firstRow.style.transition = "background .15s"; firstRow.style.background = "var(--accent-weak)";
    setTimeout(()=>{ firstRow.style.background = ""; }, 900);
    const nameInp = firstRow.querySelector(".c-name .cin");
    if(nameInp){ nameInp.focus(); nameInp.select(); }
  }
}

/* export */
function currentJson(){
  return JSON.stringify({updated: todayStr, note: model.note, prospects: model.prospects.map(p=>({...p}))}, null, 2)+"\n";
}
function currentCsv(){
  const cols = ["name","city","owner","status","score","website","email","youtube","instagram","hookVideoTitle",
    "subs","lastUpload","bestVideoViews","contactedDate","followUp1","followUp1Date","followUp2","followUp2Date","moneySignal","notes","source"];
  const q = v => '"'+(v==null?"":v).toString().replace(/"/g,'""')+'"';
  return cols.join(",")+"\n"+model.prospects.map(p=>cols.map(c=>q(p[c])).join(",")).join("\n")+"\n";
}
const exportDlg = document.getElementById("exportDlg");
function openExport(){
  document.getElementById("exportText").value = currentJson();
  if(exportDlg.showModal) exportDlg.showModal(); else alert(currentJson());
}
document.getElementById("closeDlg").onclick = ()=>exportDlg.close();
document.getElementById("dlJson").onclick = ()=>{
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([currentJson()],{type:"application/json"}));
  a.download = "data.json"; a.click(); URL.revokeObjectURL(a.href);
};
document.getElementById("cpJson").onclick = ()=>{ navigator.clipboard.writeText(currentJson()); flash("cpJson"); };
document.getElementById("cpCsv").onclick = ()=>{ const c=currentCsv(); document.getElementById("exportText").value=c; navigator.clipboard.writeText(c); flash("cpCsv"); };
function flash(id){ const b=document.getElementById(id), t=b.textContent; b.textContent="kopiert ✓"; setTimeout(()=>b.textContent=t,1200); }

load();
</script>
